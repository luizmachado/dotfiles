# Luiz Gatão Config

bindsym $mod+t exec --no-startup-id ~/dotfiles/scripts/toggle-theme.sh

bindsym $mod+p move workspace to output left
bindsym $mod+Shift+p exec flameshot gui

# Atalho para DESATIVAR (Modo Café/Apresentação)
# Desativa tanto o screensaver quanto o gerenciamento de energia (DPMS)
bindsym $mod+Shift+d exec --no-startup-id xset s off -dpms && notify-send "Inatividade" "Bloqueio automático DESATIVADO"

# Atalho para ATIVAR (Volta ao padrão de 5 minutos)
bindsym $mod+Shift+a exec --no-startup-id xset s 300 300 && xset +dpms && notify-send "Inatividade" "Bloqueio automático ATIVADO (5 min)"

# Notas (Telekasten) em janela flutuante: Ghostty + tmux "notas" em ~/notes
bindsym $mod+n exec --no-startup-id ~/dotfiles/scripts/notes-popup.sh diaria
bindsym $mod+Shift+n exec --no-startup-id ~/dotfiles/scripts/notes-popup.sh reuniao
for_window [class="com.dotfiles.notas"] floating enable, resize set 80 ppt 80 ppt, move position center

# VideoBay (GUI do yt-dlp), instalado por scripts/install-tools.sh
bindsym $mod+y exec --no-startup-id ~/.local/bin/videobay
# Janela Tk tem classe genérica "Tk": casa também o título para não pegar outros apps Tk
for_window [class="^Tk$" title="^VideoBay"] floating enable, move position center
